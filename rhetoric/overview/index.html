<style>
:root{--bg:#F2EDE1;--bg-deep:#E8DFCB;--ink:#14110D;--ink-soft:#4D4538;--ink-faint:#847962;--rule:#2B2418;--redwood:#7A2317;--moss:#2F4A38;--gold:#B07D2A;--indigo:#283358;--cream:#F8F3E6;--display:'Fraunces','Newsreader',Georgia,serif;--body:'Newsreader',Georgia,serif;--sans:'Fraunces','Newsreader',Georgia,serif;--mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:1.08rem/1.58 var(--body);font-feature-settings:'kern','liga','onum';-webkit-font-smoothing:antialiased}a{color:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(242,237,225,.96);border-bottom:1px solid var(--rule);backdrop-filter:blur(10px)}.topbar-inner{max-width:1500px;margin:0 auto;padding:11px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;font:700 .72rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}.brand,.nav{display:flex;align-items:center;gap:12px}.brand{text-decoration:none}.brand img{width:27px;height:27px;object-fit:contain}.nav{gap:18px}.nav a{text-decoration:none}.nav a:hover{color:var(--redwood)}
.mast{max-width:1500px;margin:0 auto;padding:34px 26px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,520px);gap:24px;align-items:end}.eyebrow{font:700 .68rem var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--redwood);margin:0 0 10px}.mast h1{font-family:var(--display);font-size:clamp(2.6rem,5.8vw,6.4rem);font-weight:360;line-height:.95;margin:0}.dek{font-size:clamp(1.08rem,1.7vw,1.45rem);color:var(--ink-soft);margin:0;max-width:620px}
.app{max-width:1500px;margin:0 auto;padding:14px 26px 70px}.toolbar{position:sticky;top:50px;z-index:15;display:block;background:rgba(232,223,203,.94);border:1px solid rgba(43,36,24,.28);padding:10px;margin-bottom:18px;backdrop-filter:blur(12px)}.search{border:1px solid var(--rule);background:var(--cream);padding:10px 12px;font:600 .88rem var(--sans);min-width:0;width:100%;max-width:520px;color:var(--ink)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}.panel{border:1px solid rgba(43,36,24,.28);background:rgba(248,243,230,.58)}.tree-panel{position:sticky;top:122px;max-height:calc(100vh - 142px);overflow:auto}.tree-title,.panel-title{font:800 .65rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--redwood);padding:13px 14px;border-bottom:1px solid rgba(43,36,24,.2)}.tree{padding:8px 0}.tree-row{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:stretch;padding-left:calc(var(--depth)*14px)}.tree-row.muted{opacity:.35}.tree-expander{width:22px;min-height:32px;border:0;background:transparent;color:var(--ink-faint);font:800 .65rem var(--mono);padding:0;cursor:pointer}.tree-expander:hover{background:rgba(176,125,42,.12);color:var(--ink)}.tree-expander.empty{cursor:default;visibility:hidden}.tree button.concept-button{display:grid;grid-template-columns:1fr auto;width:100%;border:0;border-left:3px solid transparent;background:transparent;text-align:left;color:var(--ink);padding:7px 12px 7px 6px;font:650 .9rem var(--sans);cursor:pointer;gap:8px}.tree button.concept-button:hover,.tree button.concept-button.active{background:rgba(176,125,42,.12);border-left-color:var(--concept-color,var(--redwood))}.tree .count{font:600 .64rem var(--mono);color:var(--ink-faint);letter-spacing:.08em}
.guide-panel{min-height:620px}.guide-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid rgba(43,36,24,.18)}.crumbs{font:700 .66rem var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}.crumbs button{border:0;background:transparent;color:inherit;padding:0;font:inherit;cursor:pointer}.crumbs button:hover{color:var(--redwood)}.concept-stat{font:700 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}.detail{padding:22px 24px 26px}.concept-label{font-family:var(--display);font-size:clamp(2.4rem,5vw,5rem);font-weight:360;line-height:.96;margin:0 0 16px}.summary{max-width:900px;color:var(--ink-soft);font-size:clamp(1.18rem,1.8vw,1.55rem);line-height:1.48;margin:0 0 20px}.summary p{margin:0 0 .85em}.summary p:last-child{margin-bottom:0}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(30px,1fr));gap:5px;margin:16px 0 22px}.tick{height:34px;border:1px solid rgba(43,36,24,.2);background:rgba(248,243,230,.64);display:flex;align-items:center;justify-content:center;text-align:center;font:700 .58rem/1 var(--mono);color:var(--ink-faint);cursor:pointer;padding:0}.tick.hit{background:color-mix(in srgb,var(--concept-color,var(--redwood)) 22%,var(--cream));border-color:color-mix(in srgb,var(--concept-color,var(--redwood)) 55%,var(--rule));color:var(--ink)}.tick.active{outline:2px solid var(--ink);outline-offset:1px}.section-summaries{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0 22px}.section-summary{border-top:2px solid color-mix(in srgb,var(--concept-color,var(--redwood)) 45%,rgba(43,36,24,.18));background:rgba(232,223,203,.34);padding:11px 12px}.section-summary a{font:800 .68rem var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--redwood);text-decoration:none}.section-summary a:hover{text-decoration:underline}.section-summary p{margin:6px 0 0;color:var(--ink-soft);font-size:1rem;line-height:1.44}.section-summary p+p{margin-top:8px}
.passages{display:grid;gap:10px;margin-top:12px}.passage{border-top:1px solid rgba(43,36,24,.18);padding:12px 0}.passage:first-child{border-top:0}.passage-meta{font:700 .62rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}.passage-text{color:var(--ink-soft);font-size:.98rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.passage-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;color:var(--ink-faint);font:800 .64rem var(--mono);letter-spacing:.12em;text-transform:uppercase}.passage-link{color:inherit;text-decoration:none}.passage-link:hover{color:var(--redwood)}.empty{padding:18px;color:var(--ink-faint);font-style:italic}
@media(max-width:1120px){.mast{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.tree-panel{position:static;max-height:none}.toolbar{top:50px;grid-template-columns:1fr}.nav{display:none}}@media(max-width:680px){.topbar-inner,.mast,.app{padding-left:14px;padding-right:14px}.toolbar{top:49px}.detail{padding:16px 14px}.guide-head{display:block}.concept-stat{margin-top:8px}.section-summaries{grid-template-columns:1fr}}

</head>
<body>
<div class="topbar"><div class="topbar-inner"><a class="brand" href="../../"><img src="../../assets/logo-dark.png" alt=""><span>Redwood Revival Press</span></a><nav class="nav"><a href="../">Explorer</a><a href="../../#catalogue">Catalogue</a></nav></div></div>
<header class="mast"><div><p class="eyebrow">Book Overview</p><h1>Aristotle's <em>Rhetoric.</em></h1></div><p class="dek">A guided outline of the book's ideas</p></header>
<main class="app">
  <section class="toolbar"><input id="search" class="search" type="search" placeholder="Search concepts and passages" autocomplete="off"></section>
  <section class="layout">
    <aside class="panel tree-panel"><div class="tree-title">Concepts</div><div class="tree" id="tree"></div></aside>
    <section class="panel guide-panel"><div class="guide-head"><div class="crumbs" id="crumbs"></div><div class="concept-stat" id="conceptStat"></div></div><div class="detail" id="detail"></div></section>
  </section>
</main>
<script src="../rhetoric-translation-data.js?v=rhetoric-full-modernization-v2-format-clean-20260528"></script>
<script src="../rhetoric-atlas-data.js?v=rhetoric-book-overview-v5-20260529"></script>
<script>
const DATA = window.RHETORIC_TRANSLATION_DATA;
const ATLAS = window.RHETORIC_ATLAS_DATA;
const concepts = ATLAS.concepts;
const conceptById = new Map(concepts.map(c => [c.id, c]));
const childrenByParent = new Map();
concepts.forEach(c => {
  const key = c.parentId || "";
  if (!childrenByParent.has(key)) childrenByParent.set(key, []);
  childrenByParent.get(key).push(c);
});
const passages = DATA.chapters.flatMap(ch => ch.passages.map(p => ({...p, chapterTitle: ch.title, chapterLabel: ch.chapterLabel, chapterId: ch.id, bookNumber: ch.bookNumber, chapterNumber: ch.chapterNumber})));
const passageById = new Map(passages.map(p => [p.id, p]));
const chapterSummaryById = new Map(Object.entries(ATLAS.chapterSummaries || {}));
let activeConcept = conceptById.get(new URLSearchParams(location.search).get("concept")) ? new URLSearchParams(location.search).get("concept") : "rhetoric.system";
let activeChapter = "";
const expandedConcepts = new Set();
const collapsedConcepts = new Set();
const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain = s => String(s || "").replace(/<[^>]+>/g,"").replace(/\{\{fnref:[^}:]+:([^}]+)\}\}/g,"[$1]").replace(/\s+/g," ").trim();
function proseHtml(text){
  const paragraphs = String(text || "").trim().split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  return paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join("");
}
function pathTo(id){ const out=[]; let c=conceptById.get(id); while(c){ out.unshift(c); c=conceptById.get(c.parentId); } return out; }
function depthOf(c){ return pathTo(c.id).length - 1; }
function defaultExpanded(c){ return depthOf(c) < 2; }
function isActivePath(c){ return pathTo(activeConcept).slice(0, -1).some(item => item.id === c.id); }
function isExpanded(c){ return isActivePath(c) || expandedConcepts.has(c.id) || (defaultExpanded(c) && !collapsedConcepts.has(c.id)); }
function setActive(id){ if(!conceptById.has(id)) return; activeConcept=id; activeChapter=""; const url=new URL(location.href); url.searchParams.set("concept",id); history.replaceState(null,"",url); renderAll(); scrollGuideToTop(); }
function expandAncestors(id){ pathTo(id).slice(0, -1).forEach(c => { expandedConcepts.add(c.id); collapsedConcepts.delete(c.id); }); }
function conceptPassages(c){ const ids = activeChapter ? (c.passageIds || []).filter(id => passageById.get(id)?.chapterId === activeChapter) : (c.passageIds || []); return ids.map(id => passageById.get(id)).filter(Boolean); }
function conceptChapters(c){
  const ids = activeChapter ? [activeChapter] : (c.chapterIds || []);
  return ids.map(id => chapterSummaryById.get(id)).filter(Boolean);
}
function renderTree(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const rows = [];
  function walk(parent){
    (childrenByParent.get(parent) || []).forEach(c => {
      const matches = !q || [c.label,c.summary,c.id].join(" ").toLowerCase().includes(q) || conceptPassages(c).some(p => [p.id,p.chapterTitle,p.modernized,p.adapted].join(" ").toLowerCase().includes(q));
      rows.push({c, matches});
      if(q || isExpanded(c)) walk(c.id);
    });
  }
  walk("");
  document.getElementById("tree").innerHTML = rows.map(({c,matches}) => {
    const children = childrenByParent.get(c.id) || [];
    const expanded = isExpanded(c);
    return `<div class="tree-row ${matches?"":"muted"}" style="--depth:${depthOf(c)};--concept-color:${c.color}">
      <button class="tree-expander ${children.length ? "" : "empty"}" data-toggle-concept="${escapeHtml(c.id)}" aria-label="${expanded ? "Collapse" : "Expand"} ${escapeHtml(c.label)}" aria-expanded="${expanded ? "true" : "false"}">${children.length ? (expanded ? "−" : "+") : ""}</button>
      <button class="concept-button ${c.id===activeConcept?"active":""}" data-concept="${escapeHtml(c.id)}"><span>${escapeHtml(c.label)}</span><span class="count">${(c.passageIds||[]).length}</span></button>
    </div>`;
  }).join("");
}
function renderCrumbs(){
  document.getElementById("crumbs").innerHTML = pathTo(activeConcept).map((c,i,arr) => `<button data-concept="${escapeHtml(c.id)}">${escapeHtml(c.label)}</button>${i<arr.length-1?" / ":""}`).join("");
}
function renderConceptStat(){
  const c = conceptById.get(activeConcept);
  const chapterCount = (c.chapterIds || []).length;
  const passageCount = (c.passageIds || []).length;
  document.getElementById("conceptStat").textContent = `${chapterCount} chapters / ${passageCount} passages`;
}
function renderTimeline(){
  const c = conceptById.get(activeConcept);
  const ids = new Set(c.passageIds || []);
  return `<div class="timeline">${DATA.chapters.map(ch => {
    const count = ch.passages.filter(p => ids.has(p.id)).length;
    const label = `${ch.bookNumber}.${ch.chapterNumber}`;
    return `<button class="tick ${count?"hit":""} ${activeChapter===ch.id?"active":""}" data-chapter="${escapeHtml(ch.id)}" title="${escapeHtml(ch.chapterLabel + " - " + ch.title)}">${escapeHtml(label)}</button>`;
  }).join("")}</div>`;
}
function renderSectionSummaries(c){
  const chapters = conceptChapters(c).filter(ch => ch.summary).slice(0, 9);
  if(!chapters.length) return "";
  return `<div class="panel-title" style="border:0;padding:12px 0 2px">Key Chapters</div><div class="section-summaries">${chapters.map(ch => `
    <div class="section-summary">
      <a href="../?book=${encodeURIComponent(ch.bookNumber || "")}#${encodeURIComponent(ch.id)}">${escapeHtml(ch.chapterLabel || `Book ${ch.bookNumber}, Chapter ${ch.chapterNumber}`)}</a>
      ${proseHtml(ch.summary)}
    </div>`).join("")}</div>`;
}
function renderDetail(){
  const c = conceptById.get(activeConcept);
  const ps = conceptPassages(c);
  document.getElementById("detail").style.setProperty("--concept-color", c.color);
  document.getElementById("detail").innerHTML = `
    <h2 class="concept-label">${escapeHtml(c.label)}</h2>
    <div class="summary">${proseHtml(c.summary)}</div>
    ${renderSectionSummaries(c)}
    ${renderTimeline()}
    <div class="panel-title" style="border:0;padding:10px 0 4px">Passages${activeChapter ? " in selected chapter" : ""}</div>
    <div class="passages">${ps.length ? ps.slice(0,36).map(renderPassage).join("") : `<div class="empty">No passages match this filter.</div>`}</div>
  `;
}
function passageLocator(p){
  const page = p.page || String(p.id || "").match(/^p(\d+)\.b\d+$/)?.[1] || "";
  const paragraph = Number.isFinite(Number(p.block)) ? Number(p.block) + 1 : "";
  return page ? `Page ${page}${paragraph ? `, paragraph ${paragraph}` : ""}` : "";
}
function renderPassage(p){
  return `<article class="passage" id="passage-${escapeHtml(p.id)}">
    <div class="passage-meta">${escapeHtml(passageLocator(p))}</div>
    <div class="passage-text">${escapeHtml(plain(p.modernized || p.adapted || p.finalLiteral || ""))}</div>
    <div class="passage-actions">
      <a class="passage-link" href="../?book=${encodeURIComponent(p.bookNumber || "")}#${encodeURIComponent(p.id)}">Explorer</a>
    </div>
  </article>`;
}
function renderAll(){ renderTree(); renderCrumbs(); renderConceptStat(); renderDetail(); }
function scrollGuideToTop(){
  const panel = document.querySelector(".guide-panel");
  if(!panel) return;
  panel.scrollIntoView({block:"start", behavior:"auto"});
  window.scrollBy(0, -64);
}
document.addEventListener("click", ev => {
  const toggle = ev.target.closest("[data-toggle-concept]");
  if(toggle){
    const id = toggle.dataset.toggleConcept;
    const concept = conceptById.get(id);
    if(concept && isExpanded(concept)){
      expandedConcepts.delete(id);
      collapsedConcepts.add(id);
    } else {
      collapsedConcepts.delete(id);
      expandedConcepts.add(id);
    }
    renderTree();
    return;
  }
  const concept = ev.target.closest("[data-concept]");
  if(concept){ setActive(concept.dataset.concept); return; }
  const chapter = ev.target.closest("[data-chapter]");
  if(chapter){ activeChapter = activeChapter === chapter.dataset.chapter ? "" : chapter.dataset.chapter; renderDetail(); return; }
});
document.getElementById("search").addEventListener("input", renderTree);
renderAll();
const focusPassage = new URLSearchParams(location.search).get("passage");
if(focusPassage){
  const ids = ATLAS.passageConcepts[focusPassage] || [];
  if(ids.length){ expandAncestors(ids[0]); setActive(ids[0]); }
}
</script>
</body>
</html>
