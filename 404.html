<!doctype html>
<html lang="en">
<head>

<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root { --bg:#F2EDE1; --ink:#14110D; --ink-soft:#4D4538; --rule:#2B2418; --redwood:#7A2317; --gold:#B07D2A; --cream:#F8F3E6; }

  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Newsreader',Georgia,serif; font-size:1.13rem; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .topbar { border-bottom:1px solid var(--rule); }
  .topbar-inner { max-width:1240px; margin:0 auto; padding:12px 36px; display:flex; justify-content:space-between; align-items:center; gap:12px; font-family:'Fraunces',Georgia,serif; font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft); font-weight:500; }
  .topbar-brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
  .topbar-brand img { width:28px; height:28px; display:block; }
  .topbar-inner nav { display:flex; gap:22px; flex-wrap:wrap; justify-content:flex-end; }
  .topbar-inner a { text-decoration:none; color:inherit; }
  .topbar-inner a:hover { color:var(--redwood); }
  main { max-width:720px; margin:0 auto; padding:96px 36px 120px; }
  .num { font-family:'Fraunces',Georgia,serif; font-variation-settings:'opsz' 144,'wght' 600; font-style:italic; font-size:4rem; color:var(--redwood); line-height:1; margin:0 0 18px; }
  h1 { font-family:'Fraunces',Georgia,serif; font-variation-settings:'opsz' 60,'wght' 380; font-size:clamp(1.6rem,3vw,2.2rem); line-height:1.15; margin:0 0 16px; }
  p { margin:0 0 28px; color:var(--ink-soft); max-width:540px; }
  .btn { display:inline-block; font-family:'Fraunces',Georgia,serif; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; font-weight:600; color:var(--cream); background:var(--redwood); text-decoration:none; padding:10px 16px; border:1px solid var(--redwood); }

</div>

  <div class="num">404</div>
  <h1>That page isn’t in the catalogue.</h1>
  <p>The address may have changed, or the page was never bound. Everything we publish is listed on the homepage.</p>
  <a class="btn" href="/#catalogue">Browse the catalogue</a>
</main>
